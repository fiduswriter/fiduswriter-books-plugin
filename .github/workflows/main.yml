name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: github.server_url == 'https://github.com'
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install pip --upgrade
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/main.zip;
          fi
      - uses: pre-commit/action@v3.0.1
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Install Chrome (Forgejo runners)
        if: github.server_url != 'https://github.com'
        run: |
            apt-get update
            apt-get install -y wget gnupg ca-certificates
            wget -q -O /tmp/google-chrome.gpg https://dl.google.com/linux/linux_signing_key.pub
            gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
            apt-get update
            apt-get install -y google-chrome-stable rsync
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        if: github.server_url == 'https://github.com'
        with:
          python-version: "3.14"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Python dependencies
        run: |
          pip install wheel
          pip install pip --upgrade
          if grep version pyproject.toml | grep -q "dev";
            then pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/develop.zip;
            else pip install https://github.com/fiduswriter/fiduswriter-server-backend/archive/main.zip;
          fi
          cd fiduswriter
          mv ../ci/configuration.py ./
          mv ../ci/.coveragerc ./
          pip install requests[security]
          pip install coverage
          pip install coveralls
          pip install packaging
          pip install webdriver-manager
          pip install selenium
          coverage run $(which fiduswriter) setup --no-static
      - name: Run tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_on: error
          command: |
            cd fiduswriter
            coverage run $(which fiduswriter) test book
      - name: Upload failed test screenshots
        if: ${{ github.server_url == 'https://github.com' && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: ${{ github.workspace }}/fiduswriter/screenshots/
      - name: Coveralls
        if: github.server_url == 'https://github.com'
        run: |
          cd fiduswriter
          coverage combine
          coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
